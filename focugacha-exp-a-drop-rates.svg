<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" role="img">
  <title>Observed vs. target gacha drop rate by rarity tier</title>
  <desc>Column chart of observed drop rates with a target reference marker on each column. Common: target 68.0%, observed 68.133%. Rare: target 22.0%, observed 21.915%. Epic: target 9.0%, observed 8.923%. Legendary: target 1.0%, observed 1.029%.</desc>
