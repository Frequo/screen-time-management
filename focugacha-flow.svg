<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-family="'Helvetica Neue', Arial, sans-serif" role="img">
  <title>Focugacha application flow</title>
  <desc>Flowchart of the Focugacha application. App launch initializes Firebase and reaches an auth gate. Unsigned users go to a login and sign-up screen, from which a "how it works" preview is available. Signed-in users reach a home shell with a three-tab bottom navigation (Gacha, Inventory, Focus) and a settings screen on the app bar. The Gacha screen leads to a cutscene and then a pull-results screen. The Inventory screen leads to session history. The Focus screen and Settings both lead to a stand-pairing screen, which pairs with an optional ESP32-S3 hardware stand over Bluetooth LE. All screens persist to Cloud Firestore with a local cache.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="900" fill="#ffffff"/>

  <!-- ============ EDGES (drawn first, under the boxes) ============ -->
  <g stroke="#555555" stroke-width="1.8" fill="none">
    <!-- App Launch -> Auth Gate -->
    <line x1="410" y1="84" x2="410" y2="136" marker-end="url(#arrow)"/>
    <!-- Auth Gate -> Login (not signed in) -->
    <line x1="500" y1="158" x2="598" y2="158" marker-end="url(#arrow)"/>
    <!-- Login -> Auth Gate (after sign-in) -->
    <line x1="598" y1="178" x2="502" y2="178" marker-end="url(#arrow)"/>
    <!-- Login -> How it works -->
    <line x1="700" y1="201" x2="700" y2="229" marker-end="url(#arrow)"/>
    <!-- Auth Gate -> Home Shell (signed in) -->
    <line x1="410" y1="194" x2="410" y2="298" marker-end="url(#arrow)"/>
    <!-- Home Shell -> Settings (app bar) -->
    <line x1="500" y1="328" x2="768" y2="328" marker-end="url(#arrow)"/>
    <!-- Home Shell -> bus -> three tabs -->
    <line x1="410" y1="356" x2="410" y2="386"/>
    <line x1="150" y1="386" x2="670" y2="386"/>
    <line x1="150" y1="386" x2="150" y2="408" marker-end="url(#arrow)"/>
    <line x1="410" y1="386" x2="410" y2="408" marker-end="url(#arrow)"/>
    <line x1="670" y1="386" x2="670" y2="408" marker-end="url(#arrow)"/>
    <!-- Gacha -> Cutscene -> Pull results -> Firestore -->
    <line x1="150" y1="522" x2="150" y2="574" marker-end="url(#arrow)"/>
    <line x1="150" y1="632" x2="150" y2="670" marker-end="url(#arrow)"/>
    <line x1="150" y1="738" x2="150" y2="792" marker-end="url(#arrow)"/>
    <!-- Inventory -> Session history -> Firestore -->
    <line x1="410" y1="522" x2="410" y2="574" marker-end="url(#arrow)"/>
    <line x1="410" y1="642" x2="410" y2="792" marker-end="url(#arrow)"/>
    <!-- Focus -> Firestore -->
    <line x1="640" y1="522" x2="640" y2="792" marker-end="url(#arrow)"/>
    <!-- Focus -> Connect stand -->
    <path d="M700,522 L700,550 L830,550 L830,574" marker-end="url(#arrow)"/>
    <!-- Settings -> Connect stand -->
    <line x1="890" y1="366" x2="890" y2="574" marker-end="url(#arrow)"/>
    <!-- Connect stand -> hardware -->
    <line x1="860" y1="642" x2="860" y2="680" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="11" fill="#666666" text-anchor="middle">
    <text x="549" y="150">not signed in</text>
    <text x="549" y="196">after sign-in</text>
    <text x="634" y="320">app bar</text>
  </g>
  <g font-size="11" fill="#666666" text-anchor="start">
    <text x="418" y="250">signed in</text>
    <text x="708" y="220">preview</text>
    <text x="870" y="666">BLE pairing</text>
  </g>

  <!-- ============ NODES ============ -->

  <!-- App Launch -->
  <rect x="310" y="28" width="200" height="56" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/>
  <text x="410" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">App Launch</text>
  <text x="410" y="70" text-anchor="middle" font-size="11.5" fill="#39557d">Firebase initialization</text>

  <!-- Auth Gate -->
  <rect x="320" y="138" width="180" height="56" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/>
  <text x="410" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">Auth Gate</text>
  <text x="410" y="180" text-anchor="middle" font-size="11.5" fill="#39557d">watch login state</text>

  <!-- Login / Sign-up -->
  <rect x="600" y="131" width="200" height="70" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="1.6"/>
  <text x="700" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2a27">Login / Sign-up</text>
  <text x="700" y="178" text-anchor="middle" font-size="11.5" fill="#8a3a36">Firebase Authentication</text>
  <text x="700" y="194" text-anchor="middle" font-size="11.5" fill="#8a3a36">email + password</text>

  <!-- How it works -->
  <rect x="610" y="231" width="180" height="50" rx="8" fill="#FDEAE9" stroke="#B85450" stroke-width="1.6"/>
  <text x="700" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a27">How It Works</text>
  <text x="700" y="269" text-anchor="middle" font-size="11.5" fill="#8a3a36">tour before signing in</text>

  <!-- Home Shell -->
  <rect x="320" y="300" width="180" height="56" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
  <text x="410" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f5c">Home Shell</text>
  <text x="410" y="342" text-anchor="middle" font-size="11.5" fill="#6a4d7d">bottom navigation</text>

  <!-- Settings -->
  <rect x="770" y="290" width="180" height="76" rx="8" fill="#EFE8F4" stroke="#9673A6" stroke-width="1.6"/>
  <text x="860" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f5c">Settings Screen</text>
  <text x="860" y="336" text-anchor="middle" font-size="11.5" fill="#6a4d7d">difficulty, theme, sound</text>
  <text x="860" y="354" text-anchor="middle" font-size="11.5" fill="#6a4d7d">account and privacy</text>

  <!-- Gacha -->
  <rect x="60" y="410" width="180" height="112" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
  <text x="150" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">Gacha Screen</text>
  <text x="150" y="464" text-anchor="middle" font-size="11.5" fill="#6f5400">spend bits</text>
  <text x="150" y="482" text-anchor="middle" font-size="11.5" fill="#6f5400">pull characters</text>
  <text x="150" y="500" text-anchor="middle" font-size="11.5" fill="#6f5400">(probability + pity)</text>

  <!-- Inventory -->
  <rect x="320" y="410" width="180" height="112" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
  <text x="410" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2c">Inventory Screen</text>
  <text x="410" y="464" text-anchor="middle" font-size="11.5" fill="#476b37">view collection</text>
  <text x="410" y="482" text-anchor="middle" font-size="11.5" fill="#476b37">pick difficulty</text>
  <text x="410" y="500" text-anchor="middle" font-size="11.5" fill="#476b37">(sets reward rate)</text>

  <!-- Focus -->
  <rect x="580" y="410" width="180" height="112" rx="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.6"/>
  <text x="670" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4f00">Focus Screen</text>
  <text x="670" y="464" text-anchor="middle" font-size="11.5" fill="#8a5a00">timed session, earn bits</text>
  <text x="670" y="482" text-anchor="middle" font-size="11.5" fill="#8a5a00">pauses if app leaves</text>
  <text x="670" y="500" text-anchor="middle" font-size="11.5" fill="#8a5a00">foreground or phone lifted</text>

  <!-- Cutscene -->
  <rect x="60" y="576" width="180" height="56" rx="8" fill="#FFF7E0" stroke="#D6B656" stroke-width="1.6"/>
  <text x="150" y="600" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5c00">Cutscene</text>
  <text x="150" y="618" text-anchor="middle" font-size="11.5" fill="#6f5400">pull animation</text>

  <!-- Session history -->
  <rect x="320" y="576" width="180" height="66" rx="8" fill="#E8F2E7" stroke="#82B366" stroke-width="1.6"/>
  <text x="410" y="600" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5a2c">Session History</text>
  <text x="410" y="618" text-anchor="middle" font-size="11.5" fill="#476b37">past sessions, streaks</text>
  <text x="410" y="634" text-anchor="middle" font-size="11.5" fill="#476b37">also from Focus, Settings</text>

  <!-- Connect stand -->
  <rect x="770" y="576" width="180" height="66" rx="8" fill="#FFF1E0" stroke="#D79B00" stroke-width="1.6"/>
  <text x="860" y="600" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a4f00">Connect Stand</text>
  <text x="860" y="618" text-anchor="middle" font-size="11.5" fill="#8a5a00">scan and pair</text>
  <text x="860" y="634" text-anchor="middle" font-size="11.5" fill="#8a5a00">optional step</text>

  <!-- Pull results -->
  <rect x="60" y="672" width="180" height="66" rx="8" fill="#FFF7E0" stroke="#D6B656" stroke-width="1.6"/>
  <text x="150" y="696" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5c00">Pull Results</text>
  <text x="150" y="714" text-anchor="middle" font-size="11.5" fill="#6f5400">characters obtained</text>
  <text x="150" y="730" text-anchor="middle" font-size="11.5" fill="#6f5400">tap for character detail</text>

  <!-- Phone stand hardware -->
  <rect x="770" y="682" width="180" height="82" rx="8" fill="#F5F5F5" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="860" y="706" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333333">Phone Stand</text>
  <text x="860" y="724" text-anchor="middle" font-size="11.5" fill="#555555">ESP32-S3 + force sensor</text>
  <text x="860" y="740" text-anchor="middle" font-size="11.5" fill="#555555">reports phone on / off</text>
  <text x="860" y="756" text-anchor="middle" font-size="11.5" fill="#555555">gates and pauses sessions</text>

  <!-- Firestore + local cache -->
  <rect x="100" y="794" width="660" height="58" rx="8" fill="#F0F0F0" stroke="#999999" stroke-width="1.6"/>
  <text x="430" y="819" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Cloud Firestore + local cache</text>
  <text x="430" y="838" text-anchor="middle" font-size="11.5" fill="#555555">offline-first sync, last-write-wins by client timestamp</text>

  <!-- caption -->
  <text x="500" y="880" text-anchor="middle" font-size="12" font-style="italic" fill="#777777">Figure 1. Focugacha application flow.</text>
</svg>
