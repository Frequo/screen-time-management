<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="720" fill="#ffffff"/>

  <!-- ============ EDGES (drawn first, under the boxes) ============ -->
  <g stroke="#555555" stroke-width="1.8" fill="none">
    <!-- App Launch -> Auth Gate -->
    <line x1="440" y1="86" x2="440" y2="138" marker-end="url(#arrow)"/>
    <!-- Auth Gate -> Login (not signed in) -->
    <line x1="530" y1="160" x2="618" y2="160" marker-end="url(#arrow)"/>
    <!-- Login -> Auth Gate (after sign-in) -->
    <line x1="620" y1="180" x2="532" y2="180" marker-end="url(#arrow)"/>
    <!-- Auth Gate -> Home Shell (signed in) -->
    <line x1="440" y1="196" x2="440" y2="244" marker-end="url(#arrow)"/>
    <!-- Home Shell -> bus -> three tabs -->
    <line x1="440" y1="302" x2="440" y2="336"/>
    <line x1="190" y1="336" x2="690" y2="336"/>
    <line x1="190" y1="336" x2="190" y2="358" marker-end="url(#arrow)"/>
    <line x1="440" y1="336" x2="440" y2="358" marker-end="url(#arrow)"/>
    <line x1="690" y1="336" x2="690" y2="358" marker-end="url(#arrow)"/>
    <!-- Gacha -> Cutscene -->
    <line x1="190" y1="470" x2="190" y2="508" marker-end="url(#arrow)"/>
    <!-- down to Firestore -->
    <line x1="190" y1="564" x2="190" y2="622" marker-end="url(#arrow)"/>
    <line x1="440" y1="470" x2="440" y2="622" marker-end="url(#arrow)"/>
    <line x1="690" y1="470" x2="690" y2="622" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="11" fill="#666666" text-anchor="middle">
    <text x="574" y="151">not signed in</text>
    <text x="574" y="195">after sign-in</text>
  </g>
  <text x="448" y="226" font-size="11" fill="#666666" text-anchor="start">signed in</text>

  <!-- ============ NODES ============ -->

  <!-- App Launch -->
  <rect x="340" y="30" width="200" height="56" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/>
  <text x="440" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">App Launch</text>
  <text x="440" y="72" text-anchor="middle" font-size="11.5" fill="#39557d">Firebase initialization</text>

  <!-- Auth Gate -->
  <rect x="350" y="140" width="180" height="56" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/>
  <text x="440" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">Auth Gate</text>
  <text x="440" y="182" text-anchor="middle" font-size="11.5" fill="#39557d">watch login state</text>

  <!-- Login / Sign-up -->
  <rect x="620" y="133" width="200" height="70" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="1.6"/>
  <text x="720" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2a27">Login / Sign-up</text>
  <text x="720" y="180" text-anchor="middle" font-size="11.5" fill="#8a3a36">Firebase Authentication</text>
  <text x="720" y="196" text-anchor="middle" font-size="11.5" fill="#8a3a36">email + password</text>

  <!-- Home Shell -->
  <rect x="350" y="246" width="180" height="56" rx="8" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
  <text x="440" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f5c">Home Shell</text>
  <text x="440" y="288" text-anchor="middle" font-size="11.5" fill="#6a4d7d">bottom navigation</text>

  <!-- Gacha -->
  <rect x="100" y="358" width="180" height="112" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
  <text x="190" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">Gacha Screen</text>
  <text x="190" y="412" text-anchor="middle" font-size="11.5" fill="#6f5400">spend bits</text>
  <text x="190" y="430" text-anchor="middle" font-size="11.5" fill="#6f5400">pull characters</text>
  <text x="190" y="448" text-anchor="middle" font-size="11.5" fill="#6f5400">(probability + pity)</text>

  <!-- Inventory -->
  <rect x="350" y="358" width="180" height="112" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
  <text x="440" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2c">Inventory Screen</text>
  <text x="440" y="412" text-anchor="middle" font-size="11.5" fill="#476b37">view collection</text>
  <text x="440" y="430" text-anchor="middle" font-size="11.5" fill="#476b37">pick difficulty</text>
  <text x="440" y="448" text-anchor="middle" font-size="11.5" fill="#476b37">(sets reward rate)</text>

  <!-- Focus -->
  <rect x="600" y="358" width="180" height="112" rx="8" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.6"/>
  <text x="690" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4f00">Focus Screen</text>
  <text x="690" y="412" text-anchor="middle" font-size="11.5" fill="#8a5a00">timed session</text>
  <text x="690" y="430" text-anchor="middle" font-size="11.5" fill="#8a5a00">earn bits</text>
  <text x="690" y="448" text-anchor="middle" font-size="11.5" fill="#8a5a00">(+ optional stand)</text>

  <!-- Cutscene -->
  <rect x="100" y="508" width="180" height="56" rx="8" fill="#FFF7E0" stroke="#D6B656" stroke-width="1.6"/>
  <text x="190" y="532" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5c00">Cutscene</text>
  <text x="190" y="550" text-anchor="middle" font-size="11.5" fill="#6f5400">pull animation</text>

  <!-- Firestore + local cache -->
  <rect x="160" y="624" width="560" height="58" rx="8" fill="#F0F0F0" stroke="#999999" stroke-width="1.6"/>
  <text x="440" y="649" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Cloud Firestore + local cache</text>
  <text x="440" y="668" text-anchor="middle" font-size="11.5" fill="#555555">offline-first sync, last-write-wins by client timestamp</text>

  <!-- caption -->
  <text x="440" y="706" text-anchor="middle" font-size="12" font-style="italic" fill="#777777">Figure 1. Focugacha application flow.</text>
</svg>
