<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" role="img">
  <title>Distribution of pulls required to obtain a Legendary</title>
  <desc>Histogram of pulls-to-Legendary in ten buckets. 1-10: 9,497 runs. 11-20: 8,482. 21-30: 7,855. 31-40: 7,125. 41-50: 6,533. 51-60: 5,771. 61-70: 5,162. 71-80: 4,729. 81-90: 4,295. 91-100: 40,551, of which 37,123 landed on exactly 100 pulls and were resolved by the pity guarantee. No run exceeded 100 pulls.</desc>
  <rect x="0" y="0" width="660" height="430" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">Distribution of pulls required to obtain a Legendary</text>
  <text x="24" y="50" font-size="11.5" fill="#52514e">100,000 simulated runs; the pity counter guarantees a Legendary on the 100th pull</text>
  <rect x="24" y="64" width="10" height="10" rx="2" fill="#2a78d6"/>
  <text x="40" y="72" font-size="11.5" fill="#52514e">Legendary pulled naturally</text>
  <rect x="225.9" y="64" width="10" height="10" rx="2" fill="#eb6834"/>
  <text x="241.9" y="72" font-size="11.5" fill="#52514e">Resolved by the 100-pull pity cap</text>
  <line x1="62" y1="352.0" x2="640" y2="352.0" stroke="#e1e0d9" stroke-width="1"/>
  <text x="52" y="356.0" font-size="11" fill="#898781" text-anchor="end">0</text>
  <line x1="62" y1="290.1" x2="640" y2="290.1" stroke="#e1e0d9" stroke-width="1"/>
  <text x="52" y="294.1" font-size="11" fill="#898781" text-anchor="end">10,000</text>
  <line x1="62" y1="228.2" x2="640" y2="228.2" stroke="#e1e0d9" stroke-width="1"/>
  <text x="52" y="232.2" font-size="11" fill="#898781" text-anchor="end">20,000</text>
  <line x1="62" y1="166.3" x2="640" y2="166.3" stroke="#e1e0d9" stroke-width="1"/>
  <text x="52" y="170.3" font-size="11" fill="#898781" text-anchor="end">30,000</text>
  <line x1="62" y1="104.4" x2="640" y2="104.4" stroke="#e1e0d9" stroke-width="1"/>
  <text x="52" y="108.4" font-size="11" fill="#898781" text-anchor="end">40,000</text>
  <line x1="62" y1="352" x2="640" y2="352" stroke="#c3c2b7" stroke-width="1"/>
