  <path d="M599.1,328.8 L599.1,105.0 Q599.1,101.0 603.1,101.0 L619.1,101.0 Q623.1,101.0 623.1,105.0 L623.1,328.8 Z" fill="#eb6834"/>
  <text x="611.1" y="93.0" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">40,551</text>
  <text x="611.1" y="372" font-size="11" fill="#52514e" text-anchor="middle">91-100</text>
  <text x="236" y="148" font-size="11.5" font-weight="600" fill="#0b0b0b">37,123 runs (37.1%) reached exactly 100 pulls</text>
  <text x="236" y="164" font-size="11.5" fill="#52514e">and were resolved by the guarantee. No run exceeded 100.</text>
  <path d="M510,144 L590.1,144 L590.1,215 L599.1,215" fill="none" stroke="#c3c2b7" stroke-width="1"/>
  <text x="351.0" y="396" font-size="11.5" fill="#52514e" text-anchor="middle">Pulls required to obtain a Legendary</text>
  <text x="24" y="418" font-size="11" font-style="italic" fill="#898781">Figure 3. The pity guarantee bounds every run at 100 pulls, piling 37% of outcomes onto the cap.</text>
