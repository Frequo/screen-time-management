  <text x="495.5" y="372" font-size="11" fill="#52514e" text-anchor="middle">71-80</text>
  <path d="M541.3,352.0 L541.3,329.4 Q541.3,325.4 545.3,325.4 L561.3,325.4 Q565.3,325.4 565.3,329.4 L565.3,352.0 Z" fill="#2a78d6"/>
  <text x="553.3" y="372" font-size="11" fill="#52514e" text-anchor="middle">81-90</text>
